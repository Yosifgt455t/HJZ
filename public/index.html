<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حجوزات الملعب 🏟️</title>
  <meta name="description" content="نظام حجوزات الملاعب - تسجيل وعرض المشاركين">
  <meta property="og:title" content="حجوزات الملعب 🏟️">
  <meta property="og:description" content="نظام حجوزات الملاعب - تسجيل وعرض المشاركين">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: white;
      margin-bottom: 30px;
      font-size: 2em;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }

    .card h2 {
      color: #667eea;
      margin-bottom: 15px;
      font-size: 1.4em;
    }

    .form-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    input[type="text"], input[type="password"] {
      flex: 1;
      padding: 12px 18px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
      font-family: inherit;
    }

    input[type="text"]:focus, input[type="password"]:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      padding: 12px 24px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
      font-family: inherit;
    }

    button:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    .btn-danger {
      background: #e74c3c;
      padding: 6px 12px;
      font-size: 13px;
    }

    .btn-danger:hover {
      background: #c0392b;
    }

    .btn-clear {
      background: #e67e22;
      padding: 8px 16px;
      font-size: 13px;
      margin-top: 10px;
    }

    .btn-clear:hover {
      background: #d35400;
    }

    .message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: none;
      text-align: center;
    }

    .message.success {
      background: #d4edda;
      color: #155724;
      display: block;
    }

    .message.error {
      background: #f8d7da;
      color: #721c24;
      display: block;
    }

    .participants {
      margin-top: 20px;
    }

    .participant {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 15px;
      background: #f8f9fa;
      border-radius: 8px;
      margin-bottom: 8px;
      transition: all 0.3s;
    }

    .participant:hover {
      background: #e9ecef;
      transform: translateX(-5px);
    }

    .participant-name {
      font-size: 18px;
      font-weight: 600;
      color: #333;
    }

    .participant-time {
      font-size: 12px;
      color: #999;
      margin-top: 4px;
    }

    .count {
      text-align: center;
      color: white;
      font-size: 1.1em;
      margin-bottom: 15px;
    }

    .count span {
      font-weight: bold;
      font-size: 1.3em;
    }

    .empty {
      text-align: center;
      color: #999;
      padding: 30px;
      font-size: 1.1em;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.5em;
      }

      .form-group {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Registration Form -->
    <div class="card">
      <h2>📝 تسجيل اسم جديد</h2>
      <div id="message" class="message"></div>
      <div class="form-group" style="margin-bottom: 0;">
        <input type="text" id="nameInput" placeholder="أدخل اسمك هنا..." autocomplete="off">
        <button id="submitBtn" onclick="addReservation()">تسجيل</button>
      </div>
    </div>

    <!-- Participants List -->
    <div class="card">
      <div class="count">عدد المشاركين: <span id="count">0</span></div>
      <h2>👥 الأسماء المسجلة</h2>
      <div id="participantsList" class="participants">
        <div class="empty">لا توجد أسماء بعد - سجل الاسم الأول!</div>
      </div>
    </div>

    <!-- Password Input (Bottom) -->
    <div class="card" style="padding: 15px 20px;">
      <div id="passMessage" class="message" style="margin-bottom: 10px;"></div>
      <div class="form-group" style="margin-bottom: 0;">
        <input type="password" id="passwordInput" placeholder="كلمة المرور" autocomplete="off">
        <button id="verifyPassBtn" onclick="verifyPassword()">تأكيد</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = '/api/reservations';
    const ADMIN_PASS = '290384';
    let isAdminActive = sessionStorage.getItem('isAdminActive') === 'true';

    // Retrieve registered IDs from localStorage
    function getMyRegisteredIds() {
      try {
        const legacy = localStorage.getItem('myReservationId');
        let ids = JSON.parse(localStorage.getItem('myRegisteredIds') || '[]');
        if (legacy && !ids.includes(String(legacy))) {
          ids.push(String(legacy));
          localStorage.setItem('myRegisteredIds', JSON.stringify(ids));
        }
        return ids;
      } catch {
        return [];
      }
    }

    function saveMyRegisteredIds(ids) {
      localStorage.setItem('myRegisteredIds', JSON.stringify(ids));
      if (ids.length > 0) {
        localStorage.setItem('myReservationId', ids[0]);
      } else {
        localStorage.removeItem('myReservationId');
        localStorage.removeItem('myReservationName');
      }
    }

    function hasAdminPassword() {
      if (isAdminActive) return true;
      const pass = document.getElementById('passwordInput');
      return pass && pass.value.trim() === ADMIN_PASS;
    }

    function verifyPassword() {
      const pass = document.getElementById('passwordInput');
      const val = pass ? pass.value.trim() : '';

      if (!val && !isAdminActive) {
        showPassMessage('الرجاء إدخال كلمة المرور', 'error');
        return;
      }

      if (val === ADMIN_PASS || isAdminActive) {
        isAdminActive = true;
        sessionStorage.setItem('isAdminActive', 'true');
        showPassMessage('تم تفعيل الصلاحية بنجاح! يمكنك إضافة وحذف أي اسم الآن ✅', 'success');
        updateAdminButtonUI();
        loadReservations();
      } else {
        showPassMessage('كلمة المرور غير صحيحة ❌', 'error');
      }
    }

    function updateAdminButtonUI() {
      const btn = document.getElementById('verifyPassBtn');
      if (btn) {
        if (isAdminActive) {
          btn.textContent = 'مُفعّل ✓';
          btn.style.background = '#27ae60';
        } else {
          btn.textContent = 'تأكيد';
          btn.style.background = '#667eea';
        }
      }
    }

    function showPassMessage(text, type) {
      const msg = document.getElementById('passMessage');
      if (!msg) return;
      msg.textContent = text;
      msg.className = 'message ' + type;
      setTimeout(() => {
        msg.className = 'message';
      }, 4000);
    }

    // Load reservations on page load and listen to password changes
    document.addEventListener('DOMContentLoaded', () => {
      updateAdminButtonUI();
      loadReservations();
      const passInput = document.getElementById('passwordInput');
      if (passInput) {
        passInput.addEventListener('input', () => {
          if (passInput.value.trim() === ADMIN_PASS) {
            verifyPassword();
          } else {
            loadReservations();
          }
        });
        passInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') verifyPassword();
        });
      }
    });

    // Update form state if user already registered (unless password 290384 is entered)
    function updateInputState(hasActiveRegistration, registeredNames) {
      const nameInput = document.getElementById('nameInput');
      const submitBtn = document.getElementById('submitBtn');

      if (hasAdminPassword()) {
        nameInput.disabled = false;
        nameInput.placeholder = 'أدخل اسماً جديداً (وضع إضافة أكثر من اسم مُفعّل)...';
        submitBtn.disabled = false;
        submitBtn.style.opacity = '1';
        submitBtn.style.cursor = 'pointer';
        return;
      }

      if (hasActiveRegistration) {
        nameInput.disabled = true;
        nameInput.placeholder = 'لقد قمت بالتسجيل باسم: ' + registeredNames.join('، ');
        nameInput.value = '';
        submitBtn.disabled = true;
        submitBtn.style.opacity = '0.6';
        submitBtn.style.cursor = 'not-allowed';
      } else {
        nameInput.disabled = false;
        nameInput.placeholder = 'أدخل اسمك هنا...';
        submitBtn.disabled = false;
        submitBtn.style.opacity = '1';
        submitBtn.style.cursor = 'pointer';
      }
    }

    // Add new reservation
    async function addReservation() {
      const adminUnlocked = hasAdminPassword();
      const myIds = getMyRegisteredIds();

      // If user has already registered and hasn't entered the correct password
      if (!adminUnlocked && myIds.length >= 1) {
        showMessage('لا يمكنك إضافة أكثر من اسم واحد! أدخل كلمة المرور لإضافة المزيد.', 'error');
        return;
      }

      const nameInput = document.getElementById('nameInput');
      const name = nameInput.value.trim();

      if (!name) {
        showMessage('الرجاء إدخال اسم', 'error');
        return;
      }

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name })
        });

        const data = await response.json();

        if (!response.ok) {
          showMessage(data.error || 'حدث خطأ', 'error');
          return;
        }

        // Save current user reservation
        const updatedIds = getMyRegisteredIds();
        updatedIds.push(String(data.id));
        saveMyRegisteredIds(updatedIds);

        nameInput.value = '';
        showMessage(`تم تسجيل ${name} بنجاح ✅`, 'success');
        loadReservations();
      } catch (error) {
        showMessage('خطأ في الاتصال', 'error');
      }
    }

    // Load all reservations
    async function loadReservations() {
      try {
        const response = await fetch(API_URL);
        const reservations = await response.json();
        displayReservations(reservations);
      } catch (error) {
        console.error('Error loading reservations:', error);
      }
    }

    // Display reservations
    function displayReservations(reservations) {
      const list = document.getElementById('participantsList');
      const count = document.getElementById('count');

      count.textContent = reservations.length;

      // Filter stored IDs to only those still existing on the server
      let myIds = getMyRegisteredIds();
      const activeMyItems = reservations.filter(r => myIds.includes(String(r.id)));
      myIds = activeMyItems.map(r => String(r.id));
      saveMyRegisteredIds(myIds);

      updateInputState(myIds.length > 0, activeMyItems.map(r => r.name));

      if (reservations.length === 0) {
        list.innerHTML = '<div class="empty">لا توجد أسماء بعد - سجل الاسم الأول!</div>';
        return;
      }

      const adminUnlocked = hasAdminPassword();

      list.innerHTML = reservations.map(r => {
        const isMine = myIds.includes(String(r.id));
        const canDelete = isMine || adminUnlocked;
        return `
        <div class="participant">
          <div>
            <div class="participant-name">#${r.id} - ${escapeHtml(r.name)} ${isMine ? '<span style="color:#667eea;font-size:13px;font-weight:normal;">(أنت)</span>' : ''}</div>
            <div class="participant-time">${new Date(r.createdAt).toLocaleString('ar-SA')}</div>
          </div>
          ${canDelete ? `<button class="btn-danger" onclick="deleteReservation(${r.id})" title="حذف">❌</button>` : ''}
        </div>
      `;
      }).join('');
    }

    // Delete reservation
    async function deleteReservation(id) {
      const adminUnlocked = hasAdminPassword();
      let myIds = getMyRegisteredIds();

      if (!adminUnlocked && !myIds.includes(String(id))) {
        showMessage('لا يمكنك حذف إلا اسمك فقط!', 'error');
        return;
      }

      if (!confirm('هل تريد حذف هذا الاسم؟')) return;

      try {
        const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
        if (response.ok) {
          myIds = myIds.filter(itemId => itemId !== String(id));
          saveMyRegisteredIds(myIds);
          showMessage('تم حذف الاسم بنجاح', 'success');
          loadReservations();
        } else {
          showMessage('حدث خطأ أثناء الحذف', 'error');
        }
      } catch (error) {
        console.error('Error deleting reservation:', error);
        showMessage('خطأ في الاتصال', 'error');
      }
    }

    // Show message
    function showMessage(text, type) {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.className = 'message ' + type;
      setTimeout(() => {
        msg.className = 'message';
      }, 3000);
    }

    // Escape HTML
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Enter key to submit
    document.getElementById('nameInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') addReservation();
    });
  </script>
</body>
</html>
